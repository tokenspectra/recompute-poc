[project]
name = "recompute-poc"
version = "0.1.0"
description = "TokenSpectra capture-and-recompute PoC v1: API Tap gateway, recompute daemon, CLI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "numpy>=2.0",
  "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.11", "ruff>=0.6"]
gpu = []  # vllm==0.32.0 is installed from the pinned image on VM-B, not from here

[project.scripts]
rpoc = "recompute_poc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recompute_poc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
